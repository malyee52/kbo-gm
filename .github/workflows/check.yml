# PR 검사: main으로 가는 PR마다 테스트와 빌드(타입 검사 포함)를 돌린다. 배포는 deploy.yml.
name: check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 환경 맞춤 디스크 캐시 (tools/calCache.ts). 캐시 안의 키에 엔진 코드 해시가 들어 있어 묵은 값을 쓰지 않는다.
      # npm ci가 node_modules를 지우므로 그 뒤에 되살린다. 같은 PR의 다음 push·재실행부터 빨라진다
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/kbo-cal
          key: kbo-cal-${{ hashFiles('src/engine/**', 'src/data/**') }}-${{ github.run_id }}
          restore-keys: kbo-cal-${{ hashFiles('src/engine/**', 'src/data/**') }}-
      - run: npm test
      # build = tsc --noEmit + vite build
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
